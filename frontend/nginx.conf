server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }

  # Read-only queue counts for the admin panel. RabbitMQ's API needs credentials
  # and sends no CORS headers, so nginx fetches it over the Docker network.
  # Only this one GET is exposed, never the rest of the management API.
  location = /mq/queues {
    limit_except GET { deny all; }
    proxy_pass http://rabbitmq:15672/api/queues?columns=name,messages_ready,messages;
    proxy_set_header Authorization "Basic Z3Vlc3Q6Z3Vlc3Q=";  # guest:guest, the compose default
  }
}
